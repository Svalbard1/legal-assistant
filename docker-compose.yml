services:
  ml-service:
    build: ./ml
    ports: ["8001:8001"]
    environment:
      LLM_API_URL: ""
    volumes:
      - hf-cache:/root/.cache/huggingface
      - qdrant-data:/app/.qdrant

  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  hf-cache:
  qdrant-data:
  postgres-data:
